version: '3.8'

services:
  hrms-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tnu_hrms_app
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
    ports:
      - "5000:5000"
    volumes:
      - hrms_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - college_internal

  nginx-proxy:
    image: nginx:alpine
    container_name: tnu_hrms_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - hrms-portal
    networks:
      - college_internal

volumes:
  hrms_data:
    driver: local

networks:
  college_internal:
    driver: bridge
